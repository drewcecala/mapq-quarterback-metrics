name: weekly in-season rankings refresh

on:
  schedule:
    - cron: "17 11 * 1,9-12 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-in-season-rankings-refresh
  cancel-in-progress: false

jobs:
  season_window:
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.window.outputs.run_refresh }}
    steps:
      - id: window
        name: Check the 2026 season window
        run: |
          today=$(date -u +%F)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          elif [[ "$today" < "2026-09-01" || "$today" > "2027-01-31" ]]; then
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Outside the September 2026-January 2027 refresh window."
          else
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: season_window
    if: needs.season_window.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit and repository checks
        run: |
          python -m unittest discover -s tests -v
          python tools/release_check.py
      - name: Confirm source terms are unchanged
        run: python tools/check_cfbd_terms.py --expected "August 12, 2026"
      - name: Restore encrypted private API cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cfbd_cache.tar.gz.enc
          key: cfbd-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cfbd-cache-${{ runner.os }}-
      - name: Decrypt private API cache
        env:
          CFBD_CACHE_KEY: ${{ secrets.CFBD_CACHE_KEY }}
        run: |
          if [[ -z "${CFBD_CACHE_KEY:-}" ]]; then
            echo "CFBD_CACHE_KEY repository secret is not configured." >&2
            exit 1
          fi
          mkdir -p work/cfbd_cache
          if [[ -f work/cfbd_cache.tar.gz.enc ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:CFBD_CACHE_KEY \
              -in work/cfbd_cache.tar.gz.enc \
              | tar -xzf - -C work
          fi
      - name: Pull and normalize authorized statistics
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [[ -z "${CFBD_API_KEY:-}" ]]; then
            echo "CFBD_API_KEY repository secret is not configured." >&2
            exit 1
          fi
          mapq-cfbd \
            --output work/cfbd_normalized.json \
            --cache-dir work/cfbd_cache \
            --roster-year 2026 \
            --seasons 2026 2025 2024 2023 \
            --refresh-year 2026 \
            --call-budget 225
      - name: Encrypt private API cache
        env:
          CFBD_CACHE_KEY: ${{ secrets.CFBD_CACHE_KEY }}
        run: |
          tar -czf - -C work cfbd_cache \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                -pass env:CFBD_CACHE_KEY \
                -out work/cfbd_cache.tar.gz.enc
      - name: Score and sanitize release
        run: |
          mapq work/cfbd_normalized.json work/cfbd_scored.json
          mapq-release work/cfbd_scored.json release/mapq_derived_rankings_latest.json
          mapq-release work/cfbd_scored.json release/mapq_derived_rankings_latest.csv
      - name: Validate generated datasets
        run: |
          python tools/validate_release_data.py \
            release/mapq_derived_rankings_latest.json \
            release/mapq_derived_rankings_latest.csv \
            --minimum-records 150 \
            --roster-year 2026 \
            --current-season 2026
          python tools/release_check.py
      - name: Commit derived updates
        run: |
          git add \
            release/mapq_derived_rankings_latest.json \
            release/mapq_derived_rankings_latest.csv
          if git diff --cached --quiet; then
            echo "No derived ranking changes to publish."
            exit 0
          fi
          git diff --cached --check
          python tools/release_check.py
          git config user.name "drewcecala"
          git config user.email "drewcecala@gmail.com"
          git commit -m "Refresh weekly QB rankings ($(date -u +%F))"
          git push origin HEAD:main
